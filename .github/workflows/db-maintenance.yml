name: Database Maintenance

on:
  schedule:
    # Run every Sunday at 3:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (show what would be deleted)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      keep_n:
        description: 'Number of scans to keep per domain'
        required: false
        default: '2'
        type: string

jobs:
  maintenance:
    name: Clean up old scans
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies (shared package only)
        run: pnpm install --filter @gecko-advisor/shared

      - name: Run database maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
          OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}
          OBJECT_STORAGE_REPORT_PREFIX: 'reports/'
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          KEEP_N="${{ github.event.inputs.keep_n || '2' }}"

          ./scripts/db-maintenance.sh $DRY_RUN_FLAG --keep=$KEEP_N

      - name: Summary
        if: always()
        run: |
          echo "## Database Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** ${{ github.event.inputs.dry_run == 'true' && 'Dry Run' || 'Live' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Keep N:** ${{ github.event.inputs.keep_n || '2' }}" >> $GITHUB_STEP_SUMMARY
