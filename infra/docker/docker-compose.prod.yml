# Production Docker Compose - Next.js Frontend with Nginx Reverse Proxy
# After Vite-to-Next.js migration, all frontend routes go through Next.js
# IMPORTANT: Service names use 'ga-' prefix to avoid DNS collisions with other apps

name: privacy-advisor-prod

services:
  # ==========================================================================
  # DATABASE SERVICE - PostgreSQL 16
  # ==========================================================================
  ga-db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      # For quick test, simple password is OK. For real prod, use strong password!
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: privacy

      # PRODUCTION: Enable query logging for audit trail
      POSTGRES_INITDB_ARGS: "-c log_statement=all -c log_destination=stderr"

    volumes:
      # PRODUCTION: Use existing volume name (DO NOT change or data will be lost!)
      - privacy-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  # ==========================================================================
  # CACHE SERVICE - Redis 7
  # ==========================================================================
  ga-redis:
    image: redis:7

    volumes:
      - privacy-redis:/data

    # PRODUCTION: Enable Redis persistence (AOF + RDB)
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

  # ==========================================================================
  # BACKEND SERVICE
  # ==========================================================================
  ga-backend:
    # Pull pre-built image from GHCR (same as staging)
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-backend:main
    pull_policy: always

    environment:
      # Core Application Settings
      NODE_ENV: production
      APP_ENV: production
      PORT: ${PORT:-5000}
      BACKEND_PORT: ${BACKEND_PORT:-5000}

      # Database & Cache (using unique service names)
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@ga-db:5432/privacy}
      REDIS_URL: ${REDIS_URL:-redis://ga-redis:6379}

      # Security & Authentication (REQUIRED)
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}

      # CORS & Public URLs (PRODUCTION DOMAINS)
      BASE_URL: ${BASE_URL:-https://geckoadvisor.com}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://geckoadvisor.com}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://api.geckoadvisor.com}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-https://geckoadvisor.com}
      API_ORIGIN: ${API_ORIGIN:-https://api.geckoadvisor.com}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}

      # Cloudflare Turnstile (OPTIONAL for quick test)
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

      # Hetzner Object Storage (OPTIONAL for quick test)
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-central}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_REPORT_PREFIX: ${OBJECT_STORAGE_REPORT_PREFIX:-reports/}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_SIGNED_URL_SECONDS: ${OBJECT_STORAGE_SIGNED_URL_SECONDS:-3600}

      # Rate Limiting (PRODUCTION: Stricter limits than staging)
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      RATE_LIMIT_SCAN_PER_MINUTE: ${RATE_LIMIT_SCAN_PER_MINUTE:-5}
      RATE_LIMIT_REPORT_PER_MINUTE: ${RATE_LIMIT_REPORT_PER_MINUTE:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_SCAN_WINDOW_MS: ${RATE_LIMIT_SCAN_WINDOW_MS:-60000}
      RATE_LIMIT_REPORT_WINDOW_MS: ${RATE_LIMIT_REPORT_WINDOW_MS:-60000}

      # Queue & Cache
      CACHE_TTL_MS: ${CACHE_TTL_MS:-900000}

      # Monitoring (OPTIONAL for quick test - but recommended!)
      SENTRY_DSN_BE: ${SENTRY_DSN_BE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Email (OPTIONAL for quick test)
      SENDGRID_ENABLED: ${SENDGRID_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@geckoadvisor.com}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://geckoadvisor.com/reset-password}

      # Feature Flags
      USE_FIXTURES: ${USE_FIXTURES:-0}

    expose:
      - "5000"

    # CRITICAL: Database MUST be healthy before backend starts
    depends_on:
      ga-db:
        condition: service_healthy
      ga-redis:
        condition: service_healthy

    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

    healthcheck:
      # Use /api/readyz (readiness) instead of /api/health (liveness) to ensure DB/Redis/Queue are ready
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/readyz',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      # CRITICAL: 45s start period allows time for Prisma migrations + initialization
      start_period: 45s

  # ==========================================================================
  # WORKER SERVICE
  # ==========================================================================
  ga-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-worker:main
    pull_policy: always

    environment:
      # Core Application Settings
      NODE_ENV: production
      APP_ENV: production

      # Database & Cache (using unique service names)
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@ga-db:5432/privacy}
      REDIS_URL: ${REDIS_URL:-redis://ga-redis:6379}

      # Public URL
      WORKER_PUBLIC_URL: ${WORKER_PUBLIC_URL:-https://worker.geckoadvisor.com}

      # Worker Configuration
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_JOB_ATTEMPTS: ${WORKER_JOB_ATTEMPTS:-3}
      WORKER_BACKOFF_MS: ${WORKER_BACKOFF_MS:-5000}
      WORKER_REQUEST_TIMEOUT_MS: ${WORKER_REQUEST_TIMEOUT_MS:-5000}
      WORKER_MAX_CONTENT_BYTES: ${WORKER_MAX_CONTENT_BYTES:-800000}
      WORKER_CRAWL_BUDGET_MS: ${WORKER_CRAWL_BUDGET_MS:-10000}
      WORKER_PAGE_LIMIT: ${WORKER_PAGE_LIMIT:-10}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-60000}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-5050}

      # Monitoring (OPTIONAL for quick test)
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Hetzner Object Storage (REQUIRED for report archiving)
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-central}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_REPORT_PREFIX: ${OBJECT_STORAGE_REPORT_PREFIX:-reports/}
      OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_SIGNED_URL_SECONDS: ${OBJECT_STORAGE_SIGNED_URL_SECONDS:-3600}

    depends_on:
      ga-db:
        condition: service_healthy
      ga-redis:
        condition: service_healthy

    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5050/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      # Increased from 20s to allow for full initialization
      start_period: 30s

  # ==========================================================================
  # NEXT.JS WEB SERVICE - Main Frontend (SSR)
  # ==========================================================================
  # After Vite-to-Next.js migration, this serves ALL frontend routes
  ga-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-web:main
    pull_policy: always

    environment:
      NODE_ENV: production
      # Internal URL to backend API (Docker network) - using unique service name
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://ga-backend:5000}
      # Public base URL for canonical URLs and OG tags
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://geckoadvisor.com}
      # Cloudflare Turnstile (Frontend Site Key - optional)
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}

    depends_on:
      ga-backend:
        condition: service_healthy

    expose:
      - "3000"

    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/robots.txt',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      # Increased from 20s to allow for Next.js warmup
      start_period: 30s

  # ==========================================================================
  # NGINX REVERSE PROXY SERVICE
  # ==========================================================================
  # Routes /api/* to backend, all other routes to Next.js web service
  ga-nginx:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-nginx:main
    pull_policy: always

    environment:
      # Core Settings
      APP_ENV: production

      # Backend Proxy URL for internal Docker networking (using unique service name)
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://ga-backend:5000}

      # Next.js Proxy URL - ALL frontend routes go here after migration (using unique service name)
      NEXTJS_PROXY_URL: ${NEXTJS_PROXY_URL:-http://ga-web:3000}

      # Security
      CSP: ${CSP:-}

    depends_on:
      ga-backend:
        condition: service_healthy
      ga-web:
        condition: service_healthy

    expose:
      - "80"

    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

    # TODO: Re-enable health check after nginx image is rebuilt with curl installed
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -sf http://localhost:80/robots.txt || exit 1"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 15s

    # CRITICAL: Connect to coolify network for Traefik proxy discovery
    # Using network alias for stable DNS name (survives container name changes)
    networks:
      default:
      coolify:
        aliases:
          - gecko-advisor-nginx

    # Traefik labels for automatic routing (when Docker provider is enabled)
    labels:
      - traefik.enable=true
      # ========== Main Domain (geckoadvisor.com) ==========
      # HTTP Router - redirect to HTTPS
      - traefik.http.routers.gecko-advisor-http.rule=Host(`geckoadvisor.com`)
      - traefik.http.routers.gecko-advisor-http.entrypoints=http
      - traefik.http.routers.gecko-advisor-http.middlewares=redirect-to-https
      # HTTPS Router
      - traefik.http.routers.gecko-advisor-https.rule=Host(`geckoadvisor.com`)
      - traefik.http.routers.gecko-advisor-https.entrypoints=https
      - traefik.http.routers.gecko-advisor-https.tls=true
      - traefik.http.routers.gecko-advisor-https.tls.certresolver=letsencrypt
      - traefik.http.routers.gecko-advisor-https.middlewares=gzip
      - traefik.http.routers.gecko-advisor-https.service=gecko-advisor
      # ========== WWW Redirect (www.geckoadvisor.com -> geckoadvisor.com) ==========
      # HTTP Router - redirect www to apex
      - traefik.http.routers.gecko-www-http.rule=Host(`www.geckoadvisor.com`)
      - traefik.http.routers.gecko-www-http.entrypoints=http
      - traefik.http.routers.gecko-www-http.middlewares=redirect-www-to-apex
      - traefik.http.routers.gecko-www-http.service=gecko-advisor
      # HTTPS Router - redirect www to apex
      - traefik.http.routers.gecko-www-https.rule=Host(`www.geckoadvisor.com`)
      - traefik.http.routers.gecko-www-https.entrypoints=https
      - traefik.http.routers.gecko-www-https.tls=true
      - traefik.http.routers.gecko-www-https.tls.certresolver=letsencrypt
      - traefik.http.routers.gecko-www-https.middlewares=redirect-www-to-apex
      - traefik.http.routers.gecko-www-https.service=gecko-advisor
      # ========== API Domain (api.geckoadvisor.com) ==========
      # HTTP Router - redirect to HTTPS
      - traefik.http.routers.gecko-api-http.rule=Host(`api.geckoadvisor.com`)
      - traefik.http.routers.gecko-api-http.entrypoints=http
      - traefik.http.routers.gecko-api-http.middlewares=redirect-to-https
      # HTTPS Router
      - traefik.http.routers.gecko-api-https.rule=Host(`api.geckoadvisor.com`)
      - traefik.http.routers.gecko-api-https.entrypoints=https
      - traefik.http.routers.gecko-api-https.tls=true
      - traefik.http.routers.gecko-api-https.tls.certresolver=letsencrypt
      - traefik.http.routers.gecko-api-https.middlewares=gzip
      - traefik.http.routers.gecko-api-https.service=gecko-advisor
      # ========== Service Configuration ==========
      - traefik.http.services.gecko-advisor.loadbalancer.server.port=80
      # Health-based routing (wait for health check to pass before routing)
      - traefik.http.services.gecko-advisor.loadbalancer.healthcheck.path=/robots.txt
      - traefik.http.services.gecko-advisor.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.gecko-advisor.loadbalancer.healthcheck.timeout=3s
      # ========== Middlewares ==========
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.regex=^https?://www\.geckoadvisor\.com/(.*)
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.replacement=https://geckoadvisor.com/$${1}
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.permanent=true
      - traefik.http.middlewares.gzip.compress=true

# ============================================================================
# VOLUMES - PRODUCTION DATA PERSISTENCE
# ============================================================================
volumes:
  privacy-postgres:
    # PostgreSQL data with query logging enabled
  privacy-redis:
    # Redis data with AOF + RDB persistence enabled

# ============================================================================
# NETWORKS - Coolify Proxy Network
# ============================================================================
networks:
  coolify:
    external: true
