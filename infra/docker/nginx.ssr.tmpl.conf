worker_processes auto;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Upstream servers
  upstream nextjs {
    server ${NEXTJS_PROXY_URL:=nextjs:3000};
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header X-XSS-Protection "0" always;
    # CSP (env-configurable)
    # Note: Next.js SSR pages need 'unsafe-inline' 'unsafe-eval' for hydration scripts
    set $csp "${CSP}";
    if ($csp = "") { set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"; }
    add_header Content-Security-Policy "$csp" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ===========================================
    # API Routes -> Backend Express
    # ===========================================
    location /api/ {
      proxy_pass ${BACKEND_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;
      proxy_read_timeout 60s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
    }

    # ===========================================
    # All Frontend Routes -> Next.js
    # ===========================================
    # After full Vite to Next.js migration, all routes go to Next.js

    # Next.js static assets - long cache
    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_set_header Host $host;
      proxy_cache_valid 200 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
      proxy_pass http://nextjs;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 24h;
    }

    # All other routes -> Next.js SSR/CSR
    location / {
      proxy_pass http://nextjs;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
    }
  }
}
