worker_processes auto;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header X-XSS-Protection "0" always;
    # CSP (env-configurable) — provide CSP env var to override
    # Default CSP allows Google Fonts: fonts.googleapis.com for CSS, fonts.gstatic.com for font files
    # Note: Next.js SSR pages need 'unsafe-inline' 'unsafe-eval' for hydration scripts
    set $csp "${CSP}";
    if ($csp = "") { set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"; }
    add_header Content-Security-Policy "$csp" always;

    # Gzip compression for bandwidth optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ============================================
    # API Routes - Proxy to Backend
    # ============================================
    location /api/ {
      # Use BACKEND_PROXY_URL env var (defaults to http://backend:5000 for Docker internal networking)
      # This allows flexible proxying: use internal Docker service name in Coolify deployments
      # to avoid Cloudflare SSL handshake issues when using external domains
      proxy_pass ${BACKEND_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Support for large response payloads (reports with many evidence items)
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;

      # Timeouts for potentially slow report generation
      proxy_read_timeout 60s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
    }

    # ============================================
    # SSR Routes - Backend-Generated HTML for SEO
    # ============================================
    # CRITICAL: These must come BEFORE Next.js routes to intercept SSR paths

    # 301 Redirect: /privacy-policy/:domain → /privacy-report/:domain
    # Preserves SEO equity from old URLs (backlinks, bookmarks, cached search results)
    # Keep active for at least 1 year after migration
    location /privacy-policy/ {
      proxy_pass ${BACKEND_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header User-Agent $http_user_agent;

      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 4 16k;

      # Cache 301 redirects at CDN level (Cloudflare)
      # Backend sets cache headers
    }

    # Privacy Report Pages -> Next.js
    # Full interactive React app with scoring ring, tabs, accordions
    # Next.js handles SSR with proper meta tags for SEO
    location /privacy-report/ {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header User-Agent $http_user_agent;

      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;

      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
    }

    # Report slug redirects: /r/:slug → /privacy-report/:domain
    # Redirects old short URLs to canonical domain-based URLs for SEO
    location /r/ {
      proxy_pass ${BACKEND_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # No caching - these are instant 301 redirects
    }

    # SSR Blog routes - Pre-rendered HTML for SEO
    # Backend serves full HTML content instead of relying on JavaScript rendering
    location /blog {
      proxy_pass ${BACKEND_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header User-Agent $http_user_agent;

      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 4 16k;

      # Cache SSR responses at CDN level (Cloudflare)
      # Individual posts: 24hr cache, blog list: 1hr cache
      # Cache headers set by backend
    }

    # ============================================
    # Next.js App - All Frontend Routes
    # ============================================
    # After Vite-to-Next.js migration, ALL frontend routes go to Next.js
    # Use NEXTJS_PROXY_URL env var (defaults to http://web:3000)

    # Next.js static assets (immutable, long-term cache)
    location /_next/static/ {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 30d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js dynamic assets (shorter cache)
    location /_next/ {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static images and assets
    location /images/ {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Favicon and app icons
    location /favicon.ico {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_cache_valid 200 30d;
    }

    # SEO files - robots.txt
    location = /robots.txt {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 1h;
    }

    # SEO files - sitemaps
    location = /sitemap.xml {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 1h;
    }

    location = /sitemap-static.xml {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 1h;
    }

    location ~ ^/sitemap-reports/ {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_valid 200 1h;
    }

    # All other routes - proxy to Next.js
    location / {
      proxy_pass ${NEXTJS_PROXY_URL};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Support for SSR page loads
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;

      # Timeouts for SSR page generation
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
    }
  }
}
