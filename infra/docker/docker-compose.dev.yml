# Development Docker Compose overlay
# Extends docker-compose.yml with dev-specific settings
# After Vite-to-Next.js migration, frontend uses Next.js web service

services:
  db:
    ports:
      - "5432:5432"
  redis:
    ports:
      - "6379:6379"
  backend:
    environment:
      NODE_ENV: development
      APP_ENV: development
    ports:
      - "5001:5000"
  worker:
    environment:
      NODE_ENV: development
      APP_ENV: development

  # Next.js web service - main frontend after migration
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://backend:5000
      NEXT_PUBLIC_BASE_URL: http://localhost:8080
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/robots.txt',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nginx reverse proxy - routes /api to backend, everything else to Next.js
  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.nginx
    environment:
      # Local dev URLs
      BACKEND_PROXY_URL: http://backend:5000
      NEXTJS_PROXY_URL: http://web:3000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
