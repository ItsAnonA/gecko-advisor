# Pre-production Docker Compose - Next.js Frontend with Nginx Reverse Proxy
# After Vite-to-Next.js migration, all frontend routes go through Next.js
# IMPORTANT: Service names use 'ga-' prefix to avoid DNS collisions with other apps

name: gecko-advisor-preprod

services:
  ga-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: privacy
    volumes:
      - privacy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ga-redis:
    image: redis:7
    volumes:
      - privacy-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ga-backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-backend:preprod
    pull_policy: always
    environment:
      NODE_ENV: production
      APP_ENV: preprod
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@ga-db:5432/privacy}
      REDIS_URL: ${REDIS_URL:-redis://ga-redis:6379}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      BASE_URL: ${BASE_URL:-https://preprod.geckoadvisor.com}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://preprodapi.geckoadvisor.com}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://preprod.geckoadvisor.com}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      # LemonSqueezy Payment Integration
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
    expose:
      - "5000"
    depends_on:
      ga-db:
        condition: service_healthy
      ga-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/readyz',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  ga-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-worker:preprod
    pull_policy: always
    environment:
      NODE_ENV: production
      APP_ENV: preprod
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@ga-db:5432/privacy}
      REDIS_URL: ${REDIS_URL:-redis://ga-redis:6379}
      WORKER_PUBLIC_URL: ${WORKER_PUBLIC_URL:-https://pworker.geckoadvisor.com}
    depends_on:
      ga-db:
        condition: service_healthy
      ga-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5050/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Next.js app serves ALL frontend routes after Vite-to-Next.js migration
  ga-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-web:preprod
    pull_policy: always
    environment:
      NODE_ENV: production
      # Internal URL to backend API (Docker network)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://ga-backend:5000}
      # Public base URL for canonical URLs and OG tags
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://preprod.geckoadvisor.com}
    depends_on:
      ga-backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/robots.txt',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nginx reverse proxy - routes /api/* to backend, everything else to Next.js
  ga-nginx:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-itsanona}/gecko-advisor-nginx:preprod
    pull_policy: always
    environment:
      APP_ENV: preprod
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://preprod.geckoadvisor.com}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://preprodapi.geckoadvisor.com}

      # Backend Proxy URL for internal Docker networking
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://ga-backend:5000}

      # Next.js Proxy URL - ALL frontend routes go here after migration
      NEXTJS_PROXY_URL: ${NEXTJS_PROXY_URL:-http://ga-web:3000}

      CSP: ${CSP:-}
    depends_on:
      ga-backend:
        condition: service_healthy
      ga-web:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/robots.txt || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  privacy-postgres:
  privacy-redis:
